<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- First thing in <head>: tells the browser the page is dark before any CSS arrives, so the
         canvas it paints while loading is dark too (no white flash at night). -->
    <meta name="color-scheme" content="dark" />
    <!-- interactive-widget=resizes-content: the on-screen keyboard must SHRINK the page, not overlay
         it — otherwise the chat composer slid under the keyboard or floated above it. Android honors
         this hint; on iOS the chat compensates via visualViewport (Chat/ChatView.tsx). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>CYOA.CAFE</title>

    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="CYOA.cafe" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- No gsi/client: sign-in is pb.authWithOAuth2() (PocketBase popup/redirect); gsi was ~95KB of dead weight. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      // send_page_view:false — page_view is sent manually from React (with the right page_location/title)
      // on every SPA route change; auto page_view would double-count the first load.
      gtag('config', 'G-G0CC5DZ5ZZ', { send_page_view: false });
      // gtag.js (~150KB) is kept off the critical path: events queue in dataLayer and the script loads
      // 2s after window load, then drains the queue.
      (function () {
        function loadGtag() {
          if (window.__gtagLoaded) return;
          window.__gtagLoaded = true;
          var s = document.createElement('script');
          s.async = true;
          s.src = 'https://www.googletagmanager.com/gtag/js?id=G-G0CC5DZ5ZZ';
          document.head.appendChild(s);
        }
        window.addEventListener('load', function () { setTimeout(loadGtag, 2000); });
      })();
    </script>

    <style>
      /* --- START Simplified Inlined Placeholder Styles --- */
      html {
        color-scheme: dark;
        background-color: #101010;
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow-x: hidden;
        box-sizing: border-box;
        overflow-y: scroll;
      }
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        box-sizing: border-box;
        /* Background must match theme.ts (MuiCssBaseline) for a seamless handoff to React. */
        background-color: #101010;
        /* Same two layers as theme.ts: darkening shade over the noise tile. */
        background-image: linear-gradient(rgba(5, 5, 5, 0.25), rgba(5, 5, 5, 0.25)), url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='noise' x='0' y='0'><feTurbulence type='turbulence' baseFrequency='0.322' numOctaves='3' stitchTiles='stitch'/><feBlend mode='darken'/></filter><rect width='100%' height='100%' filter='url(%23noise)' opacity='0.07'/></svg>");
        background-repeat: repeat;
        background-size: auto, 300px 300px;
        background-position: 0 0;
        color: #dcdcdc;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      *, *::before, *::after {
        box-sizing: inherit;
      }

      #root {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
      }
    </style>
  </head>
  <body>

    <!-- Pre-paint mock of the current page (src/prepaint/prepaint.ts, inlined at build by the
         `prepaint` plugin in vite.config.ts). React replaces #root on mount. -->
    <div id="root"></div>
    <!--prepaint-->

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
