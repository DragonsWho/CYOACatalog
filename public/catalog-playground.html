<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Catalog pre-paint playground</title>
  <style>
    /* Дефолты = реальные desktop(md)-значения из GameCard.tsx / theme.ts.
       Подбираешь слайдерами → «Скопировать значения» → отдаёшь, вшиваю в index.html. */
    :root {
      --hdr-h: 48px;
      --search-w: 80px;
      --search-h: 33px;
      --overlay: 0.7;
      --cols: 5;
      --gap: 16px;
      /* заголовок */
      --title-size: 1.8rem;
      --title-top: 15px;
      --title-blur: 4px;       /* backdrop под заголовком (GameCard blur(4px)) */
      /* обложка-заглушка */
      --blur-px: 10;
      /* описание */
      --desc-sides: 16px;      /* GameCard left/right md 16px */
      --desc-top: 59%;         /* GameCard top md 60% */
      --desc-bottom: 90px;     /* GameCard bottom md 98px */
      --desc-op: 0.7;
      --desc-blur: 2.2px;      /* размытие самого текста (мягкие края) */
      --desc-fade: 80%;        /* низ затухает (linear mask black X% → transparent) */
      /* теги */
      --tags-sides: 16px;
      --tags-bottom: 80px;     /* GameCard bottom md 38px (но автор поднимает) */
      --tag-h: 24px;           /* высота чипа md */
      --tag-gap: 5px;
      --tags-blur: 1px;
      /* подвал (автор / комменты / лайки) */
      --foot-sides: 16px;
      --foot-bottom: 16px;
      --foot-blur: 1px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #151515; color: #e0e0e0;
      font-family: Roboto, system-ui, -apple-system, Arial, sans-serif; }

    /* ── Панель настроек ─────────────────────────────────────────────── */
    #panel { position: fixed; top: 0; right: 0; width: 330px; height: 100vh;
      overflow-y: auto; background: #1a1a1a; border-left: 1px solid #333;
      padding: 12px 14px 60px; z-index: 1000; font-size: 12.5px; }
    #panel h3 { margin: 14px 0 4px; font-size: 11px; text-transform: uppercase;
      letter-spacing: 0.06em; color: #fc3447; border-bottom: 1px solid #2a2a2a; padding-bottom: 3px; }
    #panel h3:first-child { margin-top: 0; }
    .row { display: flex; align-items: center; gap: 8px; margin: 5px 0; }
    .row label { color: #bbb; flex: 1; }
    .row input[type=range] { flex: 1.5; min-width: 0; }
    .row input[type=number] { width: 60px; background: #0e0e0e; color: #eee;
      border: 1px solid #444; border-radius: 4px; padding: 3px 5px; }
    .row select { background: #0e0e0e; color: #eee; border: 1px solid #444; border-radius: 4px; padding: 3px 5px; }
    .val { color: #888; min-width: 44px; text-align: right; font-variant-numeric: tabular-nums; }
    .chk { accent-color: #fc3447; }
    #copy { width: 100%; margin-top: 14px; padding: 9px; background: #fc3447; color: #fff;
      border: 0; border-radius: 6px; font-weight: 700; cursor: pointer; }
    #copy:hover { background: #e02a3c; }
    #dump { width: 100%; margin-top: 8px; height: 150px; background: #0e0e0e; color: #9ad;
      border: 1px solid #333; border-radius: 4px; font: 11px monospace; padding: 6px; resize: vertical; }
    #bytes { margin-top: 8px; font: 12px monospace; color: #6c6; white-space: pre-line; }
    .btn2 { width: 100%; margin-top: 6px; padding: 7px; background: #2a2a2a; color: #eee;
      border: 1px solid #444; border-radius: 6px; cursor: pointer; }

    /* ── Превью (зеркалит index.html + GameCard) ─────────────────────── */
    #stage { margin-right: 330px; min-height: 100vh; }
    .ph-header { height: var(--hdr-h); background: #1f1f1f; display: flex; align-items: center;
      justify-content: center; flex-shrink: 0;
      box-shadow: 0 2px 4px -1px rgba(0,0,0,.2), 0 4px 5px 0 rgba(0,0,0,.14), 0 1px 10px 0 rgba(0,0,0,.12); }
    .ph-hcont { width: 100%; max-width: 1200px; padding: 0 24px; display: flex; align-items: center; }
    .ph-logo { font-size: 1.25rem; font-weight: 700; color: #fc3447; }
    .ph-hcluster { display: flex; align-items: center; gap: 8px; margin-left: auto; }
    .ph-filter { display: flex; border: 1px solid #3a3a3a; border-radius: 16px; overflow: hidden; }
    .ph-filter span { width: 26px; height: 26px; background: rgba(189,189,189,.18); }
    .ph-filter span:nth-child(2) { background: rgba(189,189,189,.32); }
    .ph-filter.sfw span:nth-child(1) { background: rgba(67,160,71,.7); }
    .ph-filter.nsfw span:nth-child(3) { background: rgba(211,47,47,.7); }
    .ph-search { width: var(--search-w); height: var(--search-h); border-radius: calc(var(--search-h)/2);
      background: rgba(255,255,255,.08); }
    .ph-ic { width: 34px; height: 34px; border-radius: 50%; background: rgba(255,255,255,.07); }
    .ph-avatar { width: 34px; height: 34px; border-radius: 50%; background: #555; }

    .ph-main { margin-top: 32px; padding: 0 24px; }
    .ph-container { width: 100%; max-width: 2200px; margin: 0 auto; padding: 0 24px; }
    .ph-controls { display: flex; justify-content: center; padding: 0 0 16px; }
    .ph-tabs { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center;
      background: rgba(255,255,255,.04); border-radius: 16px; padding: 4px; }
    .ph-tab { display: inline-flex; align-items: center; min-height: 40px; font-size: .875rem;
      font-weight: 600; color: #bbb; padding: 0 16px; border-radius: 12px; }
    .ph-tab.active { background: #1f1f1f; color: #fc3447;
      box-shadow: 0 2px 1px -1px rgba(0,0,0,.2), 0 1px 1px 0 rgba(0,0,0,.14); }
    .ph-ico { width: 16px; height: 16px; border-radius: 4px; background: currentColor; opacity: .75; margin-right: 6px; }
    .ph-controls2 { display: flex; justify-content: center; padding-bottom: 16px; }
    .ph-toggle { display: inline-flex; border: 1px solid rgba(255,255,255,.18); border-radius: 6px; overflow: hidden; }
    .ph-tg { width: 38px; height: 32px; display: flex; align-items: center; justify-content: center;
      border-left: 1px solid rgba(255,255,255,.12); }
    .ph-tg:first-child { border-left: 0; }
    .ph-tg-i { width: 16px; height: 16px; border-radius: 3px; background: #999; }
    .ph-tg.active { background: rgba(252,52,71,.16); }
    .ph-tg.active .ph-tg-i { background: #fc3447; }

    .ph-grid { display: grid; grid-template-columns: repeat(var(--cols), 1fr); gap: var(--gap); }
    .card { position: relative; width: 100%; padding-top: 133.33%; border-radius: 8px;
      overflow: hidden; background: #0b0b0b; box-shadow: 0 3px 5px rgba(0,0,0,.3); }
    .card .cover { position: absolute; inset: 0; background-size: cover; background-position: center;
      filter: blur(calc(var(--blur-px) * 1px)); transform: scale(1.1); }
    .card .overlay { position: absolute; inset: 0; background: rgba(0,0,0,var(--overlay)); }

    /* заголовок (GameCard: top 16, px 16, backdrop blur(4), red, 2-line clamp) */
    .card .title { position: absolute; left: 16px; right: 16px; top: var(--title-top); text-align: center;
      font-size: var(--title-size); font-weight: 700; color: #fc3447; line-height: 1.2;
      text-shadow: 2px 2px 4px rgba(0,0,0,.8); display: -webkit-box; -webkit-line-clamp: 2;
      -webkit-box-orient: vertical; overflow: hidden; }

    /* псевдо-описание: реальный случайный текст, размытый, низ затухает */
    .card .desc { position: absolute; left: var(--desc-sides); right: var(--desc-sides);
      top: var(--desc-top); bottom: var(--desc-bottom); overflow: hidden; opacity: var(--desc-op);
      color: #dcdcdc; font-size: 1rem; line-height: 1.5; text-align: left;
      filter: blur(var(--desc-blur));
      -webkit-mask-image: linear-gradient(to bottom, #000 var(--desc-fade), transparent 100%);
      mask-image: linear-gradient(to bottom, #000 var(--desc-fade), transparent 100%); }
    /* режим «полосы» вместо текста */
    .card.stripes .desc { color: transparent;
      background: repeating-linear-gradient(180deg, rgba(220,220,220,.5) 0 9px, transparent 9px 22px); }
    .card.stripes .desc * { visibility: hidden; }

    /* псевдо-теги: палитра как в GameCard, чипы чуть разной длины, лёгкое размытие */
    .card .tags { position: absolute; left: var(--tags-sides); right: var(--tags-sides);
      bottom: var(--tags-bottom); display: flex; flex-wrap: wrap; gap: var(--tag-gap);
      align-content: flex-start; filter: blur(var(--tags-blur)); }
    .card .tags i { height: var(--tag-h); border-radius: calc(var(--tag-h) / 2); display: block; }

    /* подвал: автор слева (светлое пятно), справа коммент/лайк (розовый+белый) */
    .card .foot { position: absolute; left: var(--foot-sides); right: var(--foot-sides);
      bottom: var(--foot-bottom); display: flex; align-items: center; justify-content: space-between;
      filter: blur(var(--foot-blur)); }
    .card .foot .author { height: 13px; width: 42%; border-radius: 6px; background: rgba(220,220,220,.5); }
    .card .foot .meta { display: flex; align-items: center; gap: 5px; }
    .card .foot .meta .pink { width: 15px; height: 15px; border-radius: 50%; background: #ff4081; }
    .card .foot .meta .num { width: 12px; height: 12px; border-radius: 3px; background: #fff; }
    .hide { display: none !important; }
  </style>
</head>
<body>
  <div id="stage">
    <header class="ph-header">
      <div class="ph-hcont">
        <div class="ph-logo">CYOA.CAFE</div>
        <div class="ph-hcluster">
          <div class="ph-filter" id="filter"><span></span><span></span><span></span></div>
          <div class="ph-search"></div>
          <div class="ph-ic"></div><div class="ph-ic"></div><div class="ph-ic"></div><div class="ph-ic"></div>
          <div class="ph-avatar"></div>
        </div>
      </div>
    </header>
    <main class="ph-main">
      <div class="ph-container">
        <div class="ph-controls">
          <div class="ph-tabs">
            <span class="ph-tab active"><i class="ph-ico"></i>New</span>
            <span class="ph-tab"><i class="ph-ico"></i>Top</span>
            <span class="ph-tab"><i class="ph-ico"></i>Liked</span>
            <span class="ph-tab"><i class="ph-ico"></i>Search</span>
            <span class="ph-tab"><i class="ph-ico"></i>Random</span>
            <span class="ph-tab"><i class="ph-ico"></i>Similar</span>
            <span class="ph-tab"><i class="ph-ico"></i>Semantic</span>
          </div>
        </div>
        <div class="ph-controls2">
          <div class="ph-toggle">
            <div class="ph-tg active"><span class="ph-tg-i"></span></div>
            <div class="ph-tg"><span class="ph-tg-i"></span></div>
            <div class="ph-tg"><span class="ph-tg-i"></span></div>
          </div>
        </div>
        <div class="ph-grid" id="grid"></div>
      </div>
    </main>
  </div>

  <div id="panel">
    <h3>Хедер / поиск</h3>
    <div class="row"><label>Высота хедера</label><input type="range" min="36" max="80" data-var="--hdr-h" data-unit="px"><span class="val"></span></div>
    <div class="row"><label>Поиск: ширина</label><input type="range" min="40" max="360" data-var="--search-w" data-unit="px"><span class="val"></span></div>
    <div class="row"><label>Поиск: высота</label><input type="range" min="24" max="48" data-var="--search-h" data-unit="px"><span class="val"></span></div>

    <h3>Сетка / обложка</h3>
    <div class="row"><label>Колонок</label><input type="range" min="1" max="6" data-var="--cols"><span class="val"></span></div>
    <div class="row"><label>Зазор</label><input type="range" min="4" max="32" data-var="--gap" data-unit="px"><span class="val"></span></div>
    <div class="row"><label>Затемнение</label><input type="range" min="0" max="0.95" step="0.05" data-var="--overlay"><span class="val"></span></div>
    <div class="row"><label>Блюр обложки</label><input type="range" min="0" max="24" data-var="--blur-px"><span class="val"></span></div>

    <h3>Заголовок</h3>
    <div class="row"><label>Размер (rem)</label><input type="range" min="0.8" max="2.6" step="0.05" data-var="--title-size" data-unit="rem"><span class="val"></span></div>
    <div class="row"><label>top</label><input type="range" min="4" max="40" data-var="--title-top" data-unit="px"><span class="val"></span></div>

    <h3>Описание</h3>
    <div class="row"><label>Вид</label><select id="descMode"><option value="text">текст (размытый)</option><option value="stripes">полосы</option></select></div>
    <div class="row"><label><input type="checkbox" class="chk" id="cDesc" checked> показывать</label></div>
    <div class="row"><label>Боковые отступы</label><input type="range" min="2" max="40" data-var="--desc-sides" data-unit="px"><span class="val"></span></div>
    <div class="row"><label>top</label><input type="range" min="30" max="85" data-var="--desc-top" data-unit="%"><span class="val"></span></div>
    <div class="row"><label>bottom</label><input type="range" min="40" max="150" data-var="--desc-bottom" data-unit="px"><span class="val"></span></div>
    <div class="row"><label>Прозрачность</label><input type="range" min="0" max="1" step="0.05" data-var="--desc-op"><span class="val"></span></div>
    <div class="row"><label>Размытие текста</label><input type="range" min="0" max="6" step="0.2" data-var="--desc-blur" data-unit="px"><span class="val"></span></div>
    <div class="row"><label>Затух. низа</label><input type="range" min="20" max="100" data-var="--desc-fade" data-unit="%"><span class="val"></span></div>

    <h3>Теги</h3>
    <div class="row"><label><input type="checkbox" class="chk" id="cTags" checked> показывать</label></div>
    <div class="row"><label>Боковые отступы</label><input type="range" min="2" max="40" data-var="--tags-sides" data-unit="px"><span class="val"></span></div>
    <div class="row"><label>bottom</label><input type="range" min="10" max="120" data-var="--tags-bottom" data-unit="px"><span class="val"></span></div>
    <div class="row"><label>Высота чипа</label><input type="range" min="14" max="34" data-var="--tag-h" data-unit="px"><span class="val"></span></div>
    <div class="row"><label>Зазор</label><input type="range" min="2" max="12" data-var="--tag-gap" data-unit="px"><span class="val"></span></div>
    <div class="row"><label>Размытие</label><input type="range" min="0" max="6" step="0.2" data-var="--tags-blur" data-unit="px"><span class="val"></span></div>
    <button class="btn2" id="reroll">↻ Перемешать теги</button>

    <h3>Подвал (автор / лайки)</h3>
    <div class="row"><label><input type="checkbox" class="chk" id="cFoot" checked> показывать</label></div>
    <div class="row"><label>Боковые отступы</label><input type="range" min="2" max="40" data-var="--foot-sides" data-unit="px"><span class="val"></span></div>
    <div class="row"><label>bottom</label><input type="range" min="2" max="40" data-var="--foot-bottom" data-unit="px"><span class="val"></span></div>
    <div class="row"><label>Размытие</label><input type="range" min="0" max="5" step="0.2" data-var="--foot-blur" data-unit="px"><span class="val"></span></div>

    <h3>Обложка-заглушка (base64)</h3>
    <div class="row"><label>Ширина блюра, px</label><input type="number" id="bw" value="8" min="2" max="64"></div>
    <div class="row"><label>Формат</label><select id="bfmt"><option value="image/webp">webp</option><option value="image/jpeg">jpeg</option></select></div>
    <div class="row"><label>Качество</label><input type="range" min="0.2" max="1" step="0.05" id="bq" value="0.4"><span class="val" id="bqv">0.40</span></div>
    <button class="btn2" id="recompress">Пересжать обложки</button>
    <div id="bytes"></div>

    <h3>Режим (косметика)</h3>
    <div class="row"><label>Фильтр-свитч</label>
      <select id="mode"><option value="">нейтр. (серый)</option><option value="sfw">sfw</option><option value="nsfw">nsfw</option></select></div>

    <button id="copy">📋 Скопировать значения</button>
    <textarea id="dump" readonly placeholder="нажми «Скопировать значения»"></textarea>
  </div>

  <script>
  (function () {
    var root = document.documentElement;

    // ── Слайдеры → CSS-переменные (+ подпись значения) ────────────────
    var ranges = Array.prototype.slice.call(document.querySelectorAll('#panel input[type=range][data-var]'));
    function applyRange(el) {
      var unit = el.dataset.unit || '';
      root.style.setProperty(el.dataset.var, el.value + unit);
      var out = el.parentNode.querySelector('.val');
      if (out) out.textContent = el.value + unit;
    }
    // подтягиваем стартовые значения из :root, чтобы слайдеры стояли там же
    var cs = getComputedStyle(root);
    ranges.forEach(function (el) {
      var cur = cs.getPropertyValue(el.dataset.var).trim().replace(/(px|rem|%)$/, '');
      if (cur !== '' && !isNaN(parseFloat(cur))) el.value = parseFloat(cur);
      applyRange(el);
      el.addEventListener('input', function () { applyRange(el); });
    });

    // ── Чекбоксы псевдо-элементов ─────────────────────────────────────
    function bindToggle(id, sel) {
      document.getElementById(id).addEventListener('change', function (e) {
        document.querySelectorAll(sel).forEach(function (n) { n.classList.toggle('hide', !e.target.checked); });
      });
    }
    bindToggle('cDesc', '.card .desc');
    bindToggle('cTags', '.card .tags');
    bindToggle('cFoot', '.card .foot');

    document.getElementById('descMode').addEventListener('change', function (e) {
      document.querySelectorAll('.card').forEach(function (c) { c.classList.toggle('stripes', e.target.value === 'stripes'); });
    });
    document.getElementById('mode').addEventListener('change', function (e) {
      document.getElementById('filter').className = 'ph-filter ' + e.target.value;
    });

    // ── Палитра тегов = реальные цвета GameCard, в порядке «шифра» ─────
    // rating(зел/красн) → interactivity(янтарь/сине-серый) → pov(чёрный) →
    // playtime(оранж) → genre(фиолет) → custom(сине-серый) → kinks(малина)
    var TAG_PALETTE = [
      ['rgba(46,125,50,.6)', 'rgba(211,47,47,.6)', 'rgba(255,143,0,.6)'], // rating
      ['rgba(243,179,62,.6)', 'rgba(84,110,122,.6)', 'rgba(123,31,162,.6)'], // interactivity
      ['rgba(0,0,0,.4)'],                 // pov
      ['rgba(255,140,0,.4)'],             // playtime
      ['rgba(138,43,226,.4)'],            // genre
      ['rgba(0,0,0,.4)'],                 // tone/setting
      ['rgba(96,125,139,.5)'],            // custom
      ['rgba(194,24,91,.6)', 'rgba(194,24,91,.6)'], // kinks (краснo-малиновые в конце)
    ];
    function pick(a) { return a[(Math.random() * a.length) | 0]; }
    function tagsHtml() {
      // ~8-10 чипов разной длины, цвета в порядке палитры (как реальный sort)
      var s = '', n = 8 + ((Math.random() * 3) | 0);
      for (var i = 0; i < n; i++) {
        var color = pick(TAG_PALETTE[Math.min(i, TAG_PALETTE.length - 1)]);
        var w = 30 + ((Math.random() * 46) | 0);   // длина «слова»
        s += '<i style="width:' + w + 'px;background:' + color + '"></i>';
      }
      return s;
    }

    // ── Случайный текст описания (для размытия) ───────────────────────
    var WORDS = ('originally this was made because i saw how the original had not been ' +
      'updated in years and there were very few powers or combos with combat potential ' +
      'this changes that and also provides drawbacks if you want more girls powers magic ' +
      'choose your path carefully every decision shapes the world around you forever').split(' ');
    function descText() {
      var n = 26 + ((Math.random() * 14) | 0), s = [];
      for (var i = 0; i < n; i++) s.push(WORDS[(Math.random() * WORDS.length) | 0]);
      var t = s.join(' ');
      return t.charAt(0).toUpperCase() + t.slice(1) + '.';
    }

    // ── base64-пересжатие ─────────────────────────────────────────────
    var games = [];
    var bq = document.getElementById('bq');
    bq.addEventListener('input', function () { document.getElementById('bqv').textContent = (+bq.value).toFixed(2); });
    function fmtBytes(n) { return n < 1024 ? Math.round(n) + ' B' : (n / 1024).toFixed(1) + ' KB'; }
    function recompress() {
      var W = Math.max(2, Math.min(64, +document.getElementById('bw').value || 8));
      var fmt = document.getElementById('bfmt').value, q = +bq.value;
      var total = 0, done = 0, cards = document.querySelectorAll('#grid .card');
      games.forEach(function (g, i) {
        if (!g.img) return;
        var h = Math.round(W * 1.3333);
        var c = document.createElement('canvas'); c.width = W; c.height = h;
        try {
          c.getContext('2d').drawImage(g.img, 0, 0, W, h);
          var url = c.toDataURL(fmt, q);
          total += Math.round((url.length - url.indexOf(',') - 1) * 0.75); done++;
          var cover = cards[i] && cards[i].querySelector('.cover');
          if (cover) cover.style.backgroundImage = "url('" + url + "')";
        } catch (e) {}
      });
      document.getElementById('bytes').textContent = done
        ? ('1 обложка ≈ ' + fmtBytes(total / done) + '\n× 25 экран ≈ ' + fmtBytes(total / done * 25) +
           '\n× 626 каталог ≈ ' + fmtBytes(total / done * 626))
        : 'обложки не загрузились (CORS — открой на cyoa.cafe)';
    }
    document.getElementById('recompress').addEventListener('click', recompress);

    // ── Сборка сетки ──────────────────────────────────────────────────
    function buildGrid() {
      var grid = document.getElementById('grid'), html = '';
      var list = games.length ? games : Array.from({ length: 15 }, function (_, i) {
        return { title: 'Real Waifus Bang Your Dick Like Crazy DLC Mod ' + (i + 1) };
      });
      list.forEach(function (g) {
        html += '<div class="card"><div class="cover"></div><div class="overlay"></div>'
          + '<div class="title">' + (g.title || '') + '</div>'
          + '<div class="desc"><span>' + descText() + '</span></div>'
          + '<div class="tags">' + tagsHtml() + '</div>'
          + '<div class="foot"><div class="author"></div>'
          + '<div class="meta"><span class="pink"></span><span class="num"></span>'
          + '<span class="pink"></span><span class="num"></span></div></div></div>';
      });
      grid.innerHTML = html;
    }
    document.getElementById('reroll').addEventListener('click', buildGrid);

    // ── Копировать значения ───────────────────────────────────────────
    document.getElementById('copy').addEventListener('click', function () {
      var out = ranges.map(function (el) { return el.dataset.var + ': ' + el.value + (el.dataset.unit || ''); });
      out.push('desc mode: ' + document.getElementById('descMode').value);
      out.push('desc visible: ' + document.getElementById('cDesc').checked);
      out.push('tags visible: ' + document.getElementById('cTags').checked);
      out.push('foot visible: ' + document.getElementById('cFoot').checked);
      out.push('base64: width=' + document.getElementById('bw').value + 'px, ' +
        document.getElementById('bfmt').value + ', q=' + document.getElementById('bq').value);
      var txt = out.join('\n'), ta = document.getElementById('dump');
      ta.value = txt; ta.select(); try { navigator.clipboard.writeText(txt); } catch (e) {}
    });

    // ── Реальные обложки с прода (same-origin) ────────────────────────
    fetch('/api/collections/games/records?perPage=15&sort=-created&fields=id,collectionId,title,image')
      .then(function (r) { return r.json(); })
      .then(function (d) {
        (d.items || []).forEach(function (rec) {
          if (!rec.image) return;
          games.push({ title: rec.title, coverUrl: '/api/files/' + rec.collectionId + '/' + rec.id + '/' + rec.image + '?thumb=300x400' });
        });
        buildGrid();
        games.forEach(function (g, i) {
          var im = new Image(); im.crossOrigin = 'anonymous';
          im.onload = function () { g.img = im; if (i === games.length - 1) recompress(); };
          im.src = g.coverUrl;
        });
      })
      .catch(function () { buildGrid(); });

    buildGrid();
  })();
  </script>
