<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CYOA Cafe</title>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-G0CC5DZ5ZZ"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      gtag('js', new Date());
      gtag('config', 'G-G0CC5DZ5ZZ');
    </script>
    <script>
      const global = globalThis;
    </script> 
    <script>
      (async () => {
        try {
          const response = await fetch(
            `${window.location.origin}/api/collections/games/records?page=1&perPage=25&sort=-created&expand=authors_via_games&filter=&fields=id%2Ctitle%2Cdescription%2Cimage%2Cimage_base64%2Cupvotes%2Ccomments%2Ctags%2Cexpand.authors_via_games.name`
          );
          const data = await response.json();
          window.__INITIAL_DATA__ = data;
        } catch (error) {
          console.error('Failed to preload data:', error);
          window.__INITIAL_DATA__ = null;
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
