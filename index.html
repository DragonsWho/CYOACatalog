<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
      /* --- START Simplified Inlined Placeholder Styles --- */
      html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow-x: hidden;
        box-sizing: border-box;
        /* Обеспечиваем постоянное наличие скроллбара, как в твоем CSS */
        overflow-y: scroll;
      }
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        box-sizing: border-box;
        /*
         * Основной фон - точно такой же, как в theme.ts (MuiCssBaseline)
         * Это важно для бесшовного перехода.
         */
        background-color: #101010;
        background-image: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='noise' x='0' y='0'><feTurbulence type='turbulence' baseFrequency='0.322' numOctaves='3' stitchTiles='stitch'/><feBlend mode='darken'/></filter><rect width='100%' height='100%' filter='url(%23noise)' opacity='0.07'/></svg>");
        background-repeat: repeat;
        background-size: 300px 300px;
        background-position: 0 0;
        /* position: relative; больше не нужен здесь, так как нет ::after */
        color: #dcdcdc; /* Цвет текста по умолчанию */
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      *, *::before, *::after {
        box-sizing: inherit;
      }

      /*
       * === ИСПРАВЛЕНИЕ: Удален стиль для .placeholder-overlay ===
       * Статическое затемнение убрано, чтобы избежать дублирования
       * с затемнением из theme.ts (body::after).
       */
      /* .placeholder-overlay { ... } */

      #root {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        /* position: relative; z-index: 0; больше не нужны для позиционирования над статическим оверлеем */
      }

      .app-placeholder {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
      }

      /* Хедер-заглушка */
      .placeholder-header {
        background-color: #1f1f1f; /* Цвет фона хедера (примерный, как у AppBar?) */
        height: 48px; /* Высота хедера из темы */
        width: 100%;
        flex-shrink: 0;
        box-shadow: 0 2px 4px -1px rgba(0,0,0,0.2), 0 4px 5px 0 rgba(0,0,0,0.14), 0 1px 10px 0 rgba(0,0,0,0.12); /* Стандартная тень AppBar */
        display: flex;
        align-items: center;
        justify-content: center; /* Центрируем контейнер внутри хедера */
        /* position: relative; z-index: 1; не нужны, так как нет оверлея ниже */
      }

      /* Контейнер-заглушка (аналог MUI Container maxWidth="lg") */
      .placeholder-container {
        width: 100%;
        max-width: 1200px; /* Соответствует maxWidth="lg" в MUI */
        padding-left: 24px; /* Стандартные отступы контейнера */
        padding-right: 24px;
      }

      /* Тулбар-заглушка */
      .placeholder-toolbar {
        display: flex;
        align-items: center;
        height: 100%;
      }

      /* Заголовок-заглушка */
      .placeholder-title {
        font-size: 1.25rem; /* Примерно как variant="h6" */
        font-weight: 700; /* Жирный */
        color: #fc3447; /* Основной цвет темы */
        text-decoration: none;
        line-height: 1.6;
        margin-right: auto; /* Отодвигает остальные элементы вправо */
      }

      /* Контент-заглушка */
      .placeholder-content {
        flex-grow: 1; /* Занимает оставшееся место */
        display: flex;
        justify-content: center; /* Центрируем текст */
        align-items: flex-start; /* Текст сверху */
        padding-top: 32px; /* Отступ сверху, как у MUI Container */
        padding-left: 20px; /* Небольшие боковые отступы для текста */
        padding-right: 20px;
        overflow: auto; /* Если контент вдруг станет больше */
        /* position: relative; z-index: 1; не нужны */
      }

      /* Текст загрузки */
      .placeholder-loading-text {
         /* === ИСПРАВЛЕНИЕ: Уменьшен размер шрифта === */
         font-size: 2.5rem; /* Уменьшаем размер */
         font-weight: 500;
         color: #666; /* Серый цвет, чтобы не бросался в глаза */
         line-height: 1.2;
         text-align: center;
         user-select: none; /* Запрет выделения */
      }

      /* --- END Simplified Inlined Placeholder Styles --- */
    </style>
  </head>
  <body>
    <!--
      * === ИСПРАВЛЕНИЕ: Удален div.placeholder-overlay ===
      * <div class="placeholder-overlay" aria-hidden="true"></div>
     -->

    <div id="root">
      <!-- ===== START SIMPLIFIED STATIC HTML PLACEHOLDER ===== -->
      <!-- Этот блок будет заменен React-приложением при монтировании -->
      <div class="app-placeholder" aria-hidden="true">
        <header class="placeholder-header">
          <div class="placeholder-container">
            <div class="placeholder-toolbar">
              <!-- Отображаем только заголовок для простоты -->
              <div class="placeholder-title">CYOA.CAFE</div>
              <!-- Здесь могли бы быть заглушки для кнопок, поиска и т.д., -->
              <!-- но для минимализма оставим только заголовок -->
            </div>
          </div>
        </header>
        <main class="placeholder-content">
          <!-- Текст загрузки внутри основного контента -->
          <div class="placeholder-loading-text" role="status" aria-label="Loading content">Loading...</div>
        </main>
        <!-- Футер-заглушку можно добавить, если нужно, по аналогии с хедером -->
        <!-- <footer class="placeholder-footer">...</footer> -->
      </div>
      <!-- ===== END SIMPLIFIED STATIC HTML PLACEHOLDER ===== -->
    </div>

    <!-- Скрипт вашего React-приложения -->
    <script type="module" src="/src/main.tsx"></script>

    <!--
       Скрипт для скрытия плейсхолдера теперь не нужен,
       так как React при монтировании в #root сам заменит его содержимое.
    -->
  </body>
</html>
