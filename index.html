<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- <link rel="icon" type="image/svg+xml" href="/vite.svg" /> -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CYOA.CAFE</title>
    <style>
      /* --- START Simplified Inlined Placeholder Styles --- */
      html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow-x: hidden;
        box-sizing: border-box;
        overflow-y: scroll;
      }
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        box-sizing: border-box;
        /* Основной фон */
        background-color: #101010;
        background-image: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='noise' x='0' y='0'><feTurbulence type='turbulence' baseFrequency='0.322' numOctaves='3' stitchTiles='stitch'/><feBlend mode='darken'/></filter><rect width='100%' height='100%' filter='url(%23noise)' opacity='0.07'/></svg>");
        background-repeat: repeat;
        background-size: 300px 300px;
        background-position: 0 0;
        position: relative; /* <-- ОСТАВЛЯЕМ, но для ::after уже не нужно */
        color: #dcdcdc;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      *, *::before, *::after {
        box-sizing: inherit;
      }

      /* 1. Слой-затемнитель (аналог body::after) */
      .placeholder-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(5, 5, 5, 0.25); /* <<--- Цвет из темы */
        pointer-events: none;
        z-index: 99; /* Убедимся, что он позади всего */
      }

      #root {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        position: relative; /* Чтобы контент был НАД оверлеем, если z-index не сработает */
        z-index: 0;
      }

      .app-placeholder {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
      }

      /* Хедер */
      .placeholder-header {
        background-color: #1f1f1f;
        height: 48px;
        width: 100%;
        flex-shrink: 0;
        box-shadow: 0 2px 4px -1px rgba(0,0,0,0.2), 0 4px 5px 0 rgba(0,0,0,0.14), 0 1px 10px 0 rgba(0,0,0,0.12);
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative; /* Для z-index */
        z-index: 1; /* Хедер над оверлеем */
      }

      /* Контейнер */
      .placeholder-container {
        width: 100%;
        max-width: 1200px; /* lg */
        padding-left: 24px;
        padding-right: 24px;
      }

      /* Тулбар */
      .placeholder-toolbar {
        display: flex;
        align-items: center;
        height: 100%;
      }

      /* Заголовок */
      .placeholder-title {
        font-size: 1.25rem; /* h6 */
        font-weight: 700; /* bold */
        color: #fc3447; /* Primary color */
        text-decoration: none;
        line-height: 1.6;
        margin-right: auto;
      }

      /* Контент */
      .placeholder-content {
        flex-grow: 1;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding-top: 32px;
        padding-left: 20px;
        padding-right: 20px;
        overflow: auto;
        position: relative; /* Для z-index */
        z-index: 1; /* Контент над оверлеем */
      }

      /* Текст загрузки */
      .placeholder-loading-text {
         font-size: 2.5rem;
         font-weight: 700;
         color: #666;
         line-height: 1.2;
         text-align: center;
      }

      /* --- END Simplified Inlined Placeholder Styles --- */
    </style>
  </head>
  <body>
    <!-- 2. Добавляем div для оверлея ПЕРЕД #root -->
    <div class="placeholder-overlay" aria-hidden="true"></div>

    <div id="root">
      <!-- ===== START SIMPLIFIED STATIC HTML PLACEHOLDER ===== -->
      <div class="app-placeholder" aria-hidden="true">
        <header class="placeholder-header">
          <div class="placeholder-container">
            <div class="placeholder-toolbar">
              <div class="placeholder-title">CYOA.CAFE</div>
            </div>
          </div>
        </header>
        <main class="placeholder-content">
          <div class="placeholder-loading-text" role="status" aria-label="Loading content">Loading...</div>
        </main>
      </div>
      <!-- ===== END SIMPLIFIED STATIC HTML PLACEHOLDER ===== -->
    </div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
